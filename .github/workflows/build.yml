name: Windows x64 Portable
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec install-electron --no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -r backend/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TypeScript and frontend tests
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend and real Windows integration
        run: |
          pnpm test:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/windows-integration/compatibility.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/windows-integration/geo_timezone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-electron.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-profiles.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-layout.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle Python runtime and Frida
        run: .venv/Scripts/python.exe scripts/build-backend.py
      - name: Build portable application
        run: pnpm exec electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundled runtime
        run: |
          .venv/Scripts/python.exe scripts/verify-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-electron.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-profiles.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-portable.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FridaRegionLauncher-Windows-x64-Portable
          path: |
            release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-integration-evidence
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/compatibility/*.json
          if-no-files-found: warn
